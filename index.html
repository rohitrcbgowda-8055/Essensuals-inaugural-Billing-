<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TONI&GUY ESSENSUALS — Billing</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f3f3;color:#111}
.app{max-width:900px;margin:auto;padding:16px}.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 3px 14px #00000012}
.brand{text-align:center;background:#111;color:#fff;padding:20px;border-radius:16px;margin-bottom:14px}.brand .tg{font-size:32px;font-weight:800}.brand .es{font-size:15px;letter-spacing:6px;margin-top:4px}.brand .addr{font-size:11px;line-height:1.45;margin-top:10px;color:#ddd}
h2{font-size:18px;margin:0 0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-size:12px;font-weight:700;display:block;margin-bottom:6px}
input,textarea{width:100%;padding:12px;border:1px solid #ccc;border-radius:9px;font-size:15px;background:#fff}.phone{display:flex}.prefix{padding:12px 10px;background:#eee;border:1px solid #ccc;border-right:0;border-radius:9px 0 0 9px;font-weight:700}.phone input{border-radius:0 9px 9px 0}
.row{display:grid;grid-template-columns:1fr 140px 44px;gap:8px;margin-bottom:8px}button{border:0;border-radius:10px;padding:13px 15px;font-size:14px;font-weight:800;cursor:pointer}.primary{background:#111;color:#fff}.secondary{background:#e8e8e8}.danger{background:#eee;color:#b00020}.add{width:100%;margin-top:4px}
.totals{margin-top:14px;border-top:1px solid #ddd;padding-top:12px}.totalline{display:flex;justify-content:space-between;padding:5px 0}.grand{font-size:22px;font-weight:900;border-top:1px solid #ddd;margin-top:7px;padding-top:10px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions button:last-child{grid-column:1/-1}.status{display:none;padding:10px;border-radius:9px;background:#fff3cd;font-size:13px;margin-bottom:14px}
@media(max-width:600px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr 110px 42px}.actions{grid-template-columns:1fr}}
@media print{body{background:#fff}.app>*:not(.bill-preview){display:none!important}.bill-preview{display:block!important;width:100%;max-width:760px;margin:auto}}
.invoice{font-family:Arial,sans-serif;color:#111;border:1px solid #111;padding:28px;background:#fff}.invoice-head{text-align:center;border-bottom:2px solid #111;padding-bottom:16px}
.invoice-head .big{font-size:30px;font-weight:900}.invoice-head .small{font-size:13px;letter-spacing:5px;margin-top:4px}.invoice-meta{display:flex;justify-content:space-between;margin:18px 0;font-size:12px}
.invoice table{width:100%;border-collapse:collapse;font-size:12px}.invoice th,.invoice td{border:1px solid #bbb;padding:9px;text-align:left}.invoice th:nth-child(3),.invoice td:nth-child(3){text-align:right}
.invoice-total{margin-left:auto;width:280px;margin-top:15px;font-size:13px}.invoice-total div{display:flex;justify-content:space-between;padding:5px}.invoice-total .final{font-size:19px;font-weight:900;border-top:2px solid #111;margin-top:5px;padding-top:9px}.thanks{text-align:center;border-top:1px solid #111;margin-top:24px;padding-top:14px;font-size:11px}
</style>
</head>
<body>
<div class="app">
<div class="brand"><div class="tg">TONI&amp;GUY</div><div class="es">ESSENSUALS</div>
<div class="addr">1st Floor, 1st A Cross Rd, Basaveshwara Layout, Ramakrishnappa Layout,<br>Nagashetty Halli, R.M.V. 2nd Stage, Bengaluru, Karnataka 560094<br>Ph: 9606033535</div></div>
<div id="status" class="status"></div>
<div class="card"><h2>Bill Details</h2><div class="grid">
<div><label>Invoice No.</label><input id="invoiceNo"></div><div><label>Date</label><input id="billDate" type="date"></div>
<div><label>Customer Name</label><input id="customerName"></div><div><label>Customer Phone</label><div class="phone"><span class="prefix">+91</span><input id="phone" inputmode="numeric" maxlength="10" placeholder="10 digit number"></div></div>
<div><label>Staff</label><input id="staff"></div></div></div>
<div class="card"><h2>Services</h2><div id="services"></div><button id="addService" class="secondary add">＋ Add Service</button>
<div class="totals"><div class="totalline"><span>Subtotal</span><strong id="subtotal">₹0.00</strong></div><div class="totalline"><span>Inaugural Discount (30%)</span><strong id="discount">− ₹0.00</strong></div><div class="totalline grand"><span>Total</span><strong id="total">₹0.00</strong></div></div></div>
<div class="card"><label>Notes</label><textarea id="notes" rows="3" placeholder="Optional"></textarea></div>
<div class="card actions">
<button id="sendPdf" class="primary">Send PDF on WhatsApp</button><button id="printBill" class="secondary">Print Bill</button><button id="saveBill" class="secondary">Save Bill PDF</button><button id="newBill" class="danger">New Bill</button>
</div>
<div class="bill-preview"><div class="invoice" id="printInvoice"></div></div>
</div>

<script>
"use strict";
const API_URL="YOUR_WORKER_URL/send-bill";
const $=id=>document.getElementById(id);
const money=n=>"₹"+Number(n||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function status(msg){const s=$("status");s.textContent=msg;s.style.display="block";clearTimeout(window._st);window._st=setTimeout(()=>s.style.display="none",5000)}
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function inv(){let n=+(localStorage.getItem("ess_inv")||1000)+1;localStorage.setItem("ess_inv",n);return "INV-"+n}
function addService(name="",price=""){
 const r=document.createElement("div");r.className="row";r.innerHTML='<input class="sn" placeholder="Service" value="'+esc(name)+'"><input class="sp" type="number" min="0" step="0.01" placeholder="Price" value="'+esc(price)+'"><button class="danger rm">×</button>';
 $("services").appendChild(r);r.querySelector(".sp").oninput=update;r.querySelector(".sn").oninput=update;r.querySelector(".rm").onclick=()=>{r.remove();update()};update();
}
function update(){let s=0;document.querySelectorAll(".sp").forEach(x=>s+=+x.value||0);$("subtotal").textContent=money(s);$("discount").textContent="− "+money(s*.3);$("total").textContent=money(s*.7)}
function bill(){
 const phone=$("phone").value.replace(/\D/g,""), services=[...document.querySelectorAll("#services .row")].map(r=>({name:r.querySelector(".sn").value.trim(),price:+r.querySelector(".sp").value||0})).filter(x=>x.name||x.price);
 const subtotal=services.reduce((a,x)=>a+x.price,0);
 return {invoice:$("invoiceNo").value.trim(),date:$("billDate").value,name:$("customerName").value.trim(),phone,staff:$("staff").value.trim(),notes:$("notes").value.trim(),services,subtotal,discount:subtotal*.3,total:subtotal*.7};
}
function valid(d){if(!d.name)return status("Enter customer name."),false;if(d.phone.length!==10)return status("Enter a valid 10-digit customer number."),false;if(!d.services.length)return status("Add at least one service."),false;return true}
function invoiceHTML(d){
 let rows=d.services.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.name||"Service")}</td><td>${money(x.price)}</td></tr>`).join("");
 return `<div class="invoice-head"><div class="big">TONI&amp;GUY</div><div class="small">ESSENSUALS</div><div style="font-size:10px;margin-top:8px">1st Floor, 1st A Cross Rd, Basaveshwara Layout, Ramakrishnappa Layout,<br>Nagashetty Halli, R.M.V. 2nd Stage, Bengaluru, Karnataka 560094<br>Ph: 9606033535</div></div>
 <div class="invoice-meta"><div><b>Customer:</b> ${esc(d.name)}<br><b>Phone:</b> +91 ${esc(d.phone)}</div><div><b>Invoice:</b> ${esc(d.invoice)}<br><b>Date:</b> ${esc(d.date)}<br><b>Staff:</b> ${esc(d.staff)}</div></div>
 <table><thead><tr><th>No.</th><th>Service</th><th>Amount</th></tr></thead><tbody>${rows}</tbody></table>
 <div class="invoice-total"><div><span>Subtotal</span><b>${money(d.subtotal)}</b></div><div><span>Inaugural Discount 30%</span><b>− ${money(d.discount)}</b></div><div class="final"><span>Total</span><b>${money(d.total)}</b></div></div>
 ${d.notes?`<div style="margin-top:15px;font-size:11px"><b>Notes:</b> ${esc(d.notes)}</div>`:""}<div class="thanks">Thank you for visiting TONI&amp;GUY ESSENSUALS</div>`;
}
function printBill(){const d=bill();if(!valid(d))return;$("printInvoice").innerHTML=invoiceHTML(d);window.print()}
async function saveBill(){
 const d=bill();
 if(!valid(d)) return;
 try{
   const blob=await makePdf(d);
   localStorage.setItem("ess_last_bill",JSON.stringify(d));
   const url=URL.createObjectURL(blob);
   const a=document.createElement("a");
   a.href=url;
   a.download="ESSENSUALS-"+(d.invoice||"Bill")+".pdf";
   a.style.display="none";
   document.body.appendChild(a);
   a.click();
   setTimeout(()=>{a.remove();URL.revokeObjectURL(url)},1500);
   status("PDF downloaded successfully.");
 }catch(e){
   console.error(e);
   status("Save Bill failed. Please try again.");
 }
}
function newBill(){
 if(!confirm("Start a new bill? Unsaved entries will be cleared.")) return;
 $("invoiceNo").value=inv();
 $("billDate").value=today();
 ["customerName","phone","staff","notes"].forEach(x=>$(x).value="");
 $("services").innerHTML="";
 addService();
 status("New bill ready.");
}
async function makePdf(d){
  // Minimal local PDF generator: no CDN, no external library.
  // Creates a valid A4 PDF with the bill text and basic layout.
  const escPdf = s => String(s ?? "").replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)");
  const lines = [];
  lines.push("TONI&GUY");
  lines.push("ESSENSUALS");
  lines.push("1st Floor, 1st A Cross Rd, Basaveshwara Layout, Ramakrishnappa Layout,");
  lines.push("Nagashetty Halli, R.M.V. 2nd Stage, Bengaluru, Karnataka 560094");
  lines.push("Ph: 9606033535");
  lines.push("");
  lines.push("Customer: " + d.name);
  lines.push("Phone: +91 " + d.phone);
  lines.push("Invoice: " + d.invoice);
  lines.push("Date: " + d.date);
  lines.push("Staff: " + (d.staff || "-"));
  lines.push("");
  lines.push("SERVICES");
  d.services.forEach((x,i)=>lines.push((i+1)+". "+(x.name||"Service")+" - "+money(x.price)));
  lines.push("");
  lines.push("Subtotal: " + money(d.subtotal));
  lines.push("Inaugural Discount 30%: - " + money(d.discount));
  lines.push("TOTAL: " + money(d.total));
  if(d.notes){ lines.push(""); lines.push("Notes: "+d.notes); }
  lines.push("");
  lines.push("Thank you for visiting TONI&GUY ESSENSUALS");

  // Basic PDF with Helvetica, line-wrapped to fit A4.
  const maxChars = 82, wrapped=[];
  lines.forEach(line=>{
    const s=String(line);
    if(!s){wrapped.push("");return}
    for(let i=0;i<s.length;i+=maxChars) wrapped.push(s.slice(i,i+maxChars));
  });

  const pageW=595, pageH=842, left=42, top=800, lineH=15;
  let stream="BT\n";
  stream+="/F1 18 Tf\n";
  stream+=`${left} ${top} Td\n`;
  wrapped.forEach((line,i)=>{
    if(i===1) stream+="/F1 10 Tf\n";
    if(i>1) stream+=`0 -${lineH} Td\n`;
    stream+=`(${escPdf(line)}) Tj\n`;
  });
  stream+="ET\n";

  const objects=[];
  objects.push("<< /Type /Catalog /Pages 2 0 R >>");
  objects.push("<< /Type /Pages /Kids [3 0 R] /Count 1 >>");
  objects.push("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>");
  objects.push("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>");
  objects.push(`<< /Length ${stream.length} >>\nstream\n${stream}endstream`);

  let pdf="%PDF-1.4\n";
  const offsets=[0];
  objects.forEach((obj,i)=>{
    offsets[i+1]=pdf.length;
    pdf+=(i+1)+" 0 obj\n"+obj+"\nendobj\n";
  });
  const xref=pdf.length;
  pdf+="xref\n0 "+(objects.length+1)+"\n";
  pdf+="0000000000 65535 f \n";
  for(let i=1;i<=objects.length;i++) pdf+=String(offsets[i]).padStart(10,"0")+" 00000 n \n";
  pdf+="trailer\n<< /Size "+(objects.length+1)+" /Root 1 0 R >>\nstartxref\n"+xref+"\n%%EOF";

  return new Blob([pdf],{type:"application/pdf"});
}
async function sendPdf(){
 const d=bill();
 if(!valid(d)) return;
 const api = API_URL;
 if(!api || api.includes("YOUR_WORKER_URL")){
   status("WhatsApp is not connected yet. PDF is ready — configure the WhatsApp Business API Worker to send it directly.");
   return;
 }
 try{
   status("Sending PDF to WhatsApp…");
   const blob=await makePdf(d);
   const fd=new FormData();
   fd.append("phone",d.phone);
   fd.append("customerName",d.name);
   fd.append("invoice",d.invoice);
   fd.append("pdf",blob,"ESSENSUALS-"+d.invoice+".pdf");
   const r=await fetch(api,{method:"POST",body:fd});
   const out=await r.json().catch(()=>({}));
   if(!r.ok||!out.ok) throw new Error(out.error||"WhatsApp send failed");
   status("Bill sent successfully to +91 "+d.phone+".");
 }catch(e){
   console.error(e);
   status("WhatsApp setup error: "+e.message);
 }
}
$("addService").onclick=()=>addService();$("printBill").onclick=printBill;$("saveBill").onclick=saveBill;$("newBill").onclick=newBill;$("sendPdf").onclick=sendPdf;
$("invoiceNo").value=inv();$("billDate").value=today();addService();
</script>
</body></html>
