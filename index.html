<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111">
<title>TONI&GUY ESSENSUALS Billing</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f3f3;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.top{background:#111;color:#fff;padding:18px 16px;position:sticky;top:0;z-index:10}
.brand{font-size:26px;font-weight:800;letter-spacing:1px}.sub{font-size:13px;letter-spacing:3px;margin-top:2px}
.wrap{max-width:1100px;margin:auto;padding:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 3px 14px #00000012;margin-bottom:16px}
.title{font-size:18px;font-weight:800;margin-bottom:12px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field label{display:block;font-size:12px;font-weight:700;margin:0 0 5px}
.field input,.field select{width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;font-size:16px;background:#fff}
.row{display:grid;grid-template-columns:1.4fr .8fr 42px;gap:8px;align-items:center;margin-bottom:8px}
.row select,.row input{width:100%;padding:11px;border:1px solid #ccc;border-radius:10px;font-size:15px}
.manual{display:none}.remove{border:0;background:#eee;border-radius:10px;height:42px;font-size:20px}
.buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:14px}
.btn{border:0;border-radius:11px;padding:13px 10px;font-size:15px;font-weight:800;cursor:pointer}
.dark{background:#111;color:#fff}.light{background:#eee;color:#111}.gold{background:#c9a227;color:#111}
.status{min-height:22px;font-size:13px;font-weight:700;margin-top:10px}
.preview{border:1px solid #ddd;padding:18px;max-width:500px;margin:auto}.center{text-align:center}
.line{border-top:1px solid #ddd;margin:12px 0}.billtable{width:100%;border-collapse:collapse;font-size:14px}
.billtable td{padding:6px 0}.right{text-align:right}.total{font-size:20px;font-weight:900}.muted{color:#666;font-size:12px}
.saved{display:flex;justify-content:space-between;gap:8px;align-items:center;border-bottom:1px solid #eee;padding:10px 0}
.saved:last-child{border:0}.saved button{border:0;border-radius:8px;padding:8px}.empty{color:#777;padding:10px 0}
.smallbtn{border:0;border-radius:8px;padding:8px 10px;font-weight:700;margin:2px}
.customer{padding:9px 0;border-bottom:1px solid #eee}
.hint{font-size:12px;color:#666;margin-top:5px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.tab{border:0;border-radius:10px;padding:11px;font-weight:800;background:#eee}.tab.active{background:#111;color:#fff}
.search{width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;font-size:16px;margin-bottom:8px}
.editing{background:#fff4d6;border:1px solid #d9b54a;border-radius:10px;padding:10px;margin-top:10px;font-size:13px;font-weight:700}
@media(max-width:750px){.grid{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.row{grid-template-columns:1fr .75fr 42px}.buttons{grid-template-columns:1fr 1fr}.wrap{padding:10px}}
@media print{
 body{background:#fff}.top,.no-print,.status{display:none!important}.wrap{margin:0;padding:0}.grid{display:block}
 .card:not(.print-card){display:none!important}.print-card{display:block!important;border:0;box-shadow:none;padding:0}
 .preview{border:0;max-width:none;padding:0}
}
</style>
</head>
<body>
<header class="top"><div class="brand">TONI&GUY</div><div class="sub">ESSENSUALS</div></header>
<main class="wrap">
<div class="grid">
<section>
<div class="card no-print">
<div class="title">Bill Details</div>
<div class="fields">
<div class="field"><label>Invoice No.</label><input id="invoice"></div>
<div class="field"><label>Date</label><input id="date" type="date"></div>
<div class="field"><label>Customer Name</label><input id="name" placeholder="Customer name"></div>
<div class="field"><label>Customer Phone</label><input id="phone" inputmode="numeric" maxlength="10" placeholder="10-digit number"></div>
<div class="field"><label>Staff</label><input id="staff" placeholder="Staff name"></div>
<div class="field"><label>Inaugural Discount %</label><input id="discount" type="number" min="0" max="100" value="30"></div>
</div>
<div class="hint">Invoice number is editable. Changing it updates the saved bill instead of creating a duplicate.</div>
</div>

<div class="card no-print">
<div class="title">Services</div>
<div id="services"></div>
<button class="btn light" id="add" type="button">＋ Add Service</button>
<div class="hint">Choose a service, or select <b>Manual / Other</b> to type any service name.</div>
<div class="buttons">
<button class="btn dark" id="save" type="button">Save Bill</button>
<button class="btn gold" id="wa" type="button">WhatsApp Bill</button>
<button class="btn light" id="print" type="button">Print Bill</button>
<button class="btn light" id="pdf" type="button">Save as PDF</button>
<button class="btn light" id="new" type="button">New Bill</button>
</div>
<div id="editing" class="editing" style="display:none"></div>
<div class="status" id="status"></div>
</div>

<div class="card no-print">
<div class="title">Bill History</div>
<div class="tabs">
<button class="tab active" id="allTab">All Bills</button>
<button class="tab" id="todayTab">Today</button>
</div>
<input id="billSearch" class="search" placeholder="Search invoice, customer or phone">
<div id="bills"></div>
</div>

<div class="card no-print">
<div class="title">Customer Database</div>
<button class="smallbtn" id="backup" type="button">Export Backup</button>
<button class="smallbtn" id="clearSearch" type="button">Clear Search</button>
<div id="customers"></div>
</div>
</section>

<section class="card print-card">
<div id="preview" class="preview"></div>
</section>
</div>
</main>

<script>
"use strict";
const $=id=>document.getElementById(id);
const KEY="ESSENSUALS_BILLING_V3";
const SALON={brand:"TONI&GUY",sub:"ESSENSUALS",address:"1st Floor, 1st A Cross Rd, Basaveshwara Layout, Ramakrishnappa Layout, Nagashetty Halli, R.M.V. 2nd Stage, Bengaluru, Karnataka 560094",phone:"9606033535"};
const SERVICES=["Haircut","Hair Wash","Blow Dry","Hair Colour","Highlights","Global Colour","Root Touch-up","Hair Spa","Keratin","Smoothening","Facial","Cleanup","Manicure","Pedicure","Beard Trim","Styling","Makeup","Other / Manual Entry"];
let db={bills:[],customers:{},seq:0,rows:[]};
let historyView="all";
let editingInvoice=null;

function read(){
 try{
  const x=JSON.parse(localStorage.getItem(KEY)||"null");
  if(x) db=Object.assign({bills:[],customers:{},seq:0,rows:[]},x);
 }catch(e){db={bills:[],customers:{},seq:0,rows:[]}}
 db.bills=Array.isArray(db.bills)?db.bills:[];
 db.customers=db.customers&&typeof db.customers==="object"?db.customers:{};
 db.rows=Array.isArray(db.rows)?db.rows:[];
}
function write(){localStorage.setItem(KEY,JSON.stringify(db))}
function today(){return new Date().toISOString().slice(0,10)}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function money(n){return "₹"+Number(n||0).toFixed(2)}
function status(s){$("status").textContent=s;setTimeout(()=>{if($("status").textContent===s)$("status").textContent=""},3500)}

function nextInvoice(){
 db.seq=Number(db.seq)||0;
 db.seq++;
 write();
 return "ESS-"+new Date().getFullYear()+"-"+String(db.seq).padStart(5,"0");
}
function serviceSelect(value){
 let h='<select class="svc"><option value="">Select service</option>';
 SERVICES.forEach(x=>h+='<option value="'+esc(x)+'" '+(x===value?"selected":"")+'>'+esc(x)+'</option>');
 return h+'</select>';
}
function addRow(item={service:"",manual:"",price:""}){
 db.rows.push({id:"r"+Date.now()+Math.random(),...item});
 renderRows();update();
}
function renderRows(){
 const box=$("services");box.innerHTML="";
 db.rows.forEach((r,i)=>{
  const div=document.createElement("div");div.className="row";
  div.innerHTML=serviceSelect(r.service)+
   '<input class="price" type="number" min="0" step="0.01" inputmode="decimal" placeholder="₹ Price" value="'+esc(r.price)+'">'+
   '<button class="remove" type="button">×</button>'+
   '<input class="manual" type="text" placeholder="Type service name manually" value="'+esc(r.manual)+'">';
  const sel=div.querySelector(".svc"),price=div.querySelector(".price"),man=div.querySelector(".manual"),rem=div.querySelector(".remove");
  function sync(){man.style.display=sel.value==="Other / Manual Entry"?"block":"none";man.style.gridColumn="1 / 3"}
  sel.onchange=()=>{r.service=sel.value;sync();update()};
  price.oninput=()=>{r.price=price.value;update()};
  man.oninput=()=>{r.manual=man.value;update()};
  rem.onclick=()=>{db.rows.splice(i,1);if(!db.rows.length)addRow();else{renderRows();update()}};
  sync();box.appendChild(div);
 });
}
function data(){
 const rows=db.rows.map(r=>({service:r.service==="Other / Manual Entry"?(r.manual||"Manual Service"):r.service,price:Number(r.price)||0})).filter(r=>r.service);
 const subtotal=rows.reduce((a,r)=>a+r.price,0);
 const pct=Math.max(0,Math.min(100,Number($("discount").value)||0));
 const disc=subtotal*pct/100;
 return {invoice:$("invoice").value.trim(),date:$("date").value,name:$("name").value.trim(),phone:$("phone").value.replace(/\D/g,""),staff:$("staff").value.trim(),discountPct:pct,rows,subtotal,discount:disc,total:subtotal-disc};
}
function valid(d){
 if(!d.invoice||!d.date||!d.name||!(/^\d{10}$/.test(d.phone))||!d.rows.length){status("Please enter invoice, customer name, 10-digit phone and at least one service.");return false}
 return true;
}
function update(){
 const d=data();
 $("preview").innerHTML='<div class="center"><b style="font-size:24px">'+SALON.brand+'</b><div style="letter-spacing:3px">'+SALON.sub+
 '</div><div class="muted">'+esc(SALON.address)+'</div><div class="muted">Ph: '+SALON.phone+
 '</div></div><div class="line"></div><table class="billtable"><tr><td>Invoice No.</td><td class="right">'+esc(d.invoice)+
 '</td></tr><tr><td>Date</td><td class="right">'+esc(d.date)+
 '</td></tr><tr><td>Customer</td><td class="right">'+esc(d.name||"-")+
 '</td></tr><tr><td>Phone</td><td class="right">+91 '+esc(d.phone||"-")+
 '</td></tr><tr><td>Staff</td><td class="right">'+esc(d.staff||"-")+
 '</td></tr></table><div class="line"></div><table class="billtable"><tbody>'+
 d.rows.map(r=>'<tr><td>'+esc(r.service)+'</td><td class="right">'+money(r.price)+'</td></tr>').join("")+
 '</tbody></table><div class="line"></div><table class="billtable"><tr><td>Subtotal</td><td class="right">'+money(d.subtotal)+
 '</td></tr><tr><td>Discount ('+d.discountPct+'%)</td><td class="right">-'+money(d.discount)+
 '</td></tr><tr class="total"><td>Total</td><td class="right">'+money(d.total)+
 '</td></tr></table><div class="line"></div><div class="center muted">Thank you for visiting TONI&GUY ESSENSUALS</div>';
}
function saveBill(){
 const d=data();if(!valid(d))return false;
 const old=editingInvoice;
 const duplicate=db.bills.find(x=>x.invoice===d.invoice && x.invoice!==old);
 if(duplicate){status("That invoice number already exists. Please choose another number.");return false}
 const i=db.bills.findIndex(x=>x.invoice===old);
 const same=db.bills.findIndex(x=>x.invoice===d.invoice);
 if(i>=0){
   db.bills[i]=d;
 }else if(same>=0){
   db.bills[same]=d;
 }else{
   db.bills.unshift(d);
 }
 db.customers[d.phone]={name:d.name,phone:d.phone,lastVisit:d.date,total:d.total};
 editingInvoice=d.invoice;
 write();renderBills();renderCustomers();setEditing();
 status("Bill saved successfully.");
 return true;
}
function renderBills(){
 const q=($("billSearch").value||"").toLowerCase();
 let arr=db.bills.slice();
 if(historyView==="today")arr=arr.filter(b=>b.date===today());
 arr=arr.filter(b=>(b.invoice+" "+b.name+" "+b.phone).toLowerCase().includes(q));
 arr.sort((a,b)=>(b.date+" "+b.invoice).localeCompare(a.date+" "+a.invoice));
 $("bills").innerHTML=arr.length?arr.map(b=>
 '<div class="saved"><div><b>'+esc(b.invoice)+'</b><br>'+esc(b.date)+' · '+esc(b.name)+' · <b>'+money(b.total)+'</b><br><span class="muted">+91 '+esc(b.phone)+'</span></div><div>'+
 '<button class="smallbtn" type="button" onclick="loadBill(\''+esc(b.invoice)+'\')">Edit</button>'+
 '<button class="smallbtn" type="button" onclick="whatsappSaved(\''+esc(b.invoice)+'\')">WhatsApp</button>'+
 '<button class="smallbtn" type="button" onclick="deleteBill(\''+esc(b.invoice)+'\')">Delete</button></div></div>'
 ).join(""):'<div class="empty">No bills found.</div>';
}
function setEditing(){
 const box=$("editing");
 if(editingInvoice){box.style.display="block";box.textContent="Editing invoice: "+editingInvoice+" — you can change the invoice number and press Save Bill."}
 else box.style.display="none";
}
function loadBill(id){
 const b=db.bills.find(x=>x.invoice===id);if(!b)return;
 editingInvoice=b.invoice;
 $("invoice").value=b.invoice;$("date").value=b.date;$("name").value=b.name;$("phone").value=b.phone;$("staff").value=b.staff||"";$("discount").value=b.discountPct;
 db.rows=b.rows.map((r,j)=>({id:"loaded"+j,service:SERVICES.includes(r.service)?r.service:"Other / Manual Entry",manual:SERVICES.includes(r.service)?"":r.service,price:r.price}));
 renderRows();update();setEditing();window.scrollTo({top:0,behavior:"smooth"});status("Bill loaded for editing.");
}
function deleteBill(id){
 if(!confirm("Delete this bill permanently?"))return;
 db.bills=db.bills.filter(x=>x.invoice!==id);write();renderBills();status("Bill deleted.");
}
function whatsappSaved(id){
 const b=db.bills.find(x=>x.invoice===id);if(b)sendWhatsApp(b);
}
function sendWhatsApp(b){
 const lines=b.rows.map(r=>"- "+r.service+": "+money(r.price)).join("\n");
 const msg=`✨ TONI&GUY ESSENSUALS – BILL ✨

Invoice: ${b.invoice}
Date: ${b.date}

Customer: ${b.name}
Service:
${lines}

Subtotal: ${money(b.subtotal)}
Discount (${b.discountPct}%): -${money(b.discount)}
Total: ${money(b.total)}

TONI&GUY ESSENSUALS
RMV 2nd Stage, Bengaluru
📞 ${SALON.phone}`;
 location.href="https://wa.me/91"+b.phone+"?text="+encodeURIComponent(msg);
}
function renderCustomers(){
 const arr=Object.values(db.customers).sort((a,b)=>String(b.lastVisit).localeCompare(String(a.lastVisit)));
 $("customers").innerHTML=arr.length?arr.map(c=>'<div class="customer"><b>'+esc(c.name)+'</b><br>+91 '+esc(c.phone)+' · Last visit: '+esc(c.lastVisit)+' · '+money(c.total)+'</div>').join(""):'<div class="empty">No customers saved yet.</div>';
}
function newBill(){
 editingInvoice=null;
 $("invoice").value=nextInvoice();$("date").value=today();$("name").value="";$("phone").value="";$("staff").value="";$("discount").value=30;
 db.rows=[];addRow();setEditing();update();status("New bill ready.");
}
function exportBackup(){
 const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="essensuals-billing-backup-"+today()+".json";a.click();URL.revokeObjectURL(a.href);
}
$("add").onclick=()=>addRow();
$("save").onclick=saveBill;
$("wa").onclick=()=>{if(saveBill()){const b=db.bills.find(x=>x.invoice===editingInvoice);if(b)sendWhatsApp(b)}};
$("print").onclick=()=>window.print();
$("pdf").onclick=()=>window.print();
$("new").onclick=newBill;
$("billSearch").oninput=renderBills;
$("backup").onclick=exportBackup;
$("clearSearch").onclick=()=>{$("billSearch").value="";renderBills()};
$("allTab").onclick=()=>{historyView="all";$("allTab").classList.add("active");$("todayTab").classList.remove("active");renderBills()};
$("todayTab").onclick=()=>{historyView="today";$("todayTab").classList.add("active");$("allTab").classList.remove("active");renderBills()};
["invoice","date","name","phone","staff","discount"].forEach(id=>$(id).addEventListener("input",update));
$("phone").oninput=e=>e.target.value=e.target.value.replace(/\D/g,"").slice(0,10);

read();
if(!db.rows.length)db.rows=[];
newBill();
renderBills();
renderCustomers();
</script>
</body>
</html>
