<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ESSENSUALS Billing</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f4f4;color:#111}.top{background:#111;color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:25px;font-weight:900;letter-spacing:1px}.brand small{display:block;font-size:11px;letter-spacing:5px;margin-top:3px}.top a{color:#fff;text-decoration:none;border:1px solid #555;padding:9px 13px;border-radius:8px;font-size:12px}.wrap{max-width:1400px;margin:20px auto;padding:0 18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:18px;box-shadow:0 4px 18px #0000000a}.card h2{margin:0 0 14px;font-size:18px}.row{display:grid;grid-template-columns:1fr 160px 42px;gap:8px;margin:8px 0}input,select,textarea{width:100%;padding:11px;border:1px solid #ccc;border-radius:8px;background:#fff;font:inherit}textarea{min-height:90px;resize:vertical}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:8px;padding:11px 14px;font-weight:700;cursor:pointer}.primary{background:#111;color:#fff}.secondary{background:#eee;color:#111}.danger{background:#f1d9d9}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.status{position:fixed;right:20px;bottom:20px;background:#111;color:#fff;padding:13px 16px;border-radius:9px;display:none;z-index:20}.list{max-height:470px;overflow:auto}.item{border:1px solid #ddd;border-radius:10px;padding:12px;margin:8px 0}.item .muted{font-size:12px;color:#666;margin-top:4px}.pill{display:inline-block;padding:4px 7px;border-radius:20px;background:#eee;font-size:11px;font-weight:700}.preview{background:#fff;border:1px solid #ccc;min-height:500px;padding:24px;max-width:650px;margin:auto}.invoice-head{text-align:center;border-bottom:2px solid #111;padding-bottom:14px}.invoice-head .big{font-size:34px;font-weight:900}.invoice-head .small{font-size:13px;letter-spacing:6px}.addr{font-size:10px;line-height:1.5;margin-top:8px}.invoice-title{text-align:center;font-weight:900;margin:16px 0}.meta{display:grid;grid-template-columns:1fr 1fr;font-size:12px;line-height:1.7}.preview table{width:100%;border-collapse:collapse;font-size:12px}.preview th,.preview td{padding:8px;border-bottom:1px solid #ddd;text-align:left}.preview th:last-child,.preview td:last-child{text-align:right}.totals{margin-left:auto;max-width:270px;margin-top:12px;font-size:12px}.totals div{display:flex;justify-content:space-between;padding:5px}.totals .final{font-size:17px;font-weight:900;border-top:2px solid #111;margin-top:5px;padding-top:9px}.thanks{text-align:center;margin-top:30px;font-size:11px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}.stat{background:#fff;border:1px solid #ddd;border-radius:12px;padding:14px}.stat b{font-size:22px;display:block}.stat span{font-size:11px;color:#666}.wide{grid-column:1/-1}@media(max-width:900px){.grid{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.preview{max-width:none}.row{grid-template-columns:1fr 120px 42px}}
@media print{body{background:#fff}.top,.no-print,.card:not(.print-card),.status{display:none!important}.wrap{margin:0;padding:0}.grid{display:block}.print-card{display:block;border:0;box-shadow:none;padding:0}.preview{border:0;max-width:none}}
</style></head><body><div class="top"><div class="brand">TONI&GUY <small>ESSENSUALS</small></div><a href="ESSENSUALS-Customer-Marketing.html">Customer & Marketing</a></div><div class="wrap"><div id="status" class="status"></div><div class="grid"><div><div class="card"><h2>Bill Details</h2><div class="fields"><div><label>Invoice No.</label><input id="invoice"></div><div><label>Date</label><input id="date" type="date"></div><div><label>Customer Name</label><input id="name" placeholder="Customer name"></div><div><label>Customer Phone</label><input id="phone" inputmode="numeric" maxlength="10" placeholder="10-digit number"></div><div><label>Staff</label><input id="staff"></div><div><label>Discount %</label><input id="discount" type="number" min="0" max="100" value="30"></div></div></div><div class="card"><h2>Services</h2><div id="services"></div><button class="btn secondary" id="add">＋ Add Service</button><div class="actions"><button class="btn primary" id="save">Save Bill</button><button class="btn primary" id="wa">Copy Bill Image & Open WhatsApp</button><button class="btn secondary" id="print">Print Bill</button><button class="btn secondary" id="new">New Bill</button></div></div><div class="card"><h2>Saved Bills</h2><input id="billSearch" placeholder="Search invoice or customer"><div class="list" id="billList"></div></div></div><div><div class="card print-card"><h2>Live Bill Preview</h2><div class="preview" id="preview"></div></div><div class="card no-print"><h2>Shared Customer Database</h2><p style="font-size:12px;color:#666">This database is shared with the Customer & Marketing app when both are opened from the same website/domain.</p><div class="actions"><button class="btn secondary" id="refresh">Refresh Customer Data</button><button class="btn secondary" id="backup">Export Backup</button></div><div class="list" id="customers"></div></div></div></div></div><script>
const DB_NAME='ESSENSUALS_SHARED_DB_V1'; const DB_VER=1;
function makeFallbackDB(){
 const prefix='ESSENSUALS_FALLBACK_'+DB_NAME+'_';
 const mem={customers:[],bills:[],reminders:[],meta:[]};
 const canLS=()=>{try{const k='__ess_test__';localStorage.setItem(k,'1');localStorage.removeItem(k);return true}catch(e){return false}};
 const useLS=canLS();
 const load=k=>{if(!useLS)return mem[k].slice();try{return JSON.parse(localStorage.getItem(prefix+k)||'[]')}catch(e){return mem[k].slice()}};
 const save=(k,v)=>{if(!useLS){mem[k]=v.slice();return}try{localStorage.setItem(prefix+k,JSON.stringify(v))}catch(e){mem[k]=v.slice()}};
 const stores=['customers','bills','reminders','meta'];
 stores.forEach(k=>{if(useLS){try{if(localStorage.getItem(prefix+k)===null)save(k,[])}catch(e){}}});
 return {transaction:(name)=>({objectStore:()=>({
   getAll:()=>{const q={result:load(name)};setTimeout(()=>q.onsuccess&&q.onsuccess({target:q}),0);return q},
   get:(key)=>{const arr=load(name), keyName=name==='meta'?'key':'id';const q={result:arr.find(x=>x[keyName]===key)};setTimeout(()=>q.onsuccess&&q.onsuccess({target:q}),0);return q},
   put:(value)=>{const arr=load(name), keyName=name==='meta'?'key':'id';let v={...value};if(keyName==='id' && (v.id===undefined||v.id===null)){const ids=arr.map(x=>Number(x.id)||0);v.id=(ids.length?Math.max(...ids):0)+1}const i=arr.findIndex(x=>x[keyName]===v[keyName]);if(i>=0)arr[i]=v;else arr.push(v);save(name,arr);return {result:v}},
   delete:(key)=>{const arr=load(name),keyName=name==='meta'?'key':'id';save(name,arr.filter(x=>x[keyName]!==key));return {result:undefined}}
 }) ,oncomplete:null,onerror:null})};
}
let fallbackDB=null;
function dbOpen(){return new Promise((res,rej)=>{
 try{
  if(!window.indexedDB) throw new Error('IndexedDB unavailable');
  const r=indexedDB.open(DB_NAME,DB_VER);
  r.onupgradeneeded=()=>{const d=r.result;['customers','bills','reminders','meta'].forEach(s=>{if(!d.objectStoreNames.contains(s)){const key=s==='meta'?'key':'id';d.createObjectStore(s,{keyPath:key,autoIncrement:key==='id'});}})};
  r.onsuccess=()=>res(r.result);
  r.onerror=()=>{fallbackDB=fallbackDB||makeFallbackDB();res(fallbackDB)};
 }catch(e){fallbackDB=fallbackDB||makeFallbackDB();res(fallbackDB)}
})}
async function tx(store,mode,fn){const d=await dbOpen();
 if(d===fallbackDB){try{return await fn(d.transaction(store,mode).objectStore(store))}catch(e){throw e}}
 return new Promise((res,rej)=>{const t=d.transaction(store,mode);const s=t.objectStore(store);let out;try{out=fn(s)}catch(e){rej(e);return}t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error)})}
const dbAll=s=>tx(s,'readonly',st=>new Promise((res,rej)=>{const r=st.getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
const dbPut=(s,v)=>tx(s,'readwrite',st=>st.put(v)); const dbDel=(s,k)=>tx(s,'readwrite',st=>st.delete(k));
async function getMeta(key,def){const v=await tx('meta','readonly',s=>new Promise(r=>{const q=s.get(key);q.onsuccess=()=>r(q.result?.value??def)}));return v}
async function setMeta(key,value){return dbPut('meta',{key,value})}
async function nextInvoice(){let n=Number(await getMeta('invoiceCounter',1000))+1;await setMeta('invoiceCounter',n);return 'INV-'+n}
async function customers(){return (await dbAll('customers')).sort((a,b)=>String(b.updatedAt||'').localeCompare(String(a.updatedAt||'')))}
async function saveCustomer(c){const all=await customers();const old=all.find(x=>x.phone===c.phone);const rec={...(old||{}),...c,id:old?.id,updatedAt:new Date().toISOString()};if(old) rec.id=old.id; else rec.visits=rec.visits||0;await dbPut('customers',rec);return rec}
async function saveBill(b){const allBills=await bills();const existing=allBills.find(x=>x.invoice===b.invoice);await dbPut('bills',{...b,...(existing?{id:existing.id,savedAt:existing.savedAt}:{savedAt:new Date().toISOString()})});const old=(await customers()).find(c=>c.phone===b.phone);if(existing){await saveCustomer({name:b.name,phone:b.phone,lastVisit:b.date,lastInvoice:b.invoice});}else{await saveCustomer({name:b.name,phone:b.phone,visits:(old?.visits||0)+1,lastVisit:b.date,lastInvoice:b.invoice,totalSpend:(old?.totalSpend||0)+b.total});}return true}
async function bills(){return (await dbAll('bills')).sort((a,b)=>String(b.savedAt||'').localeCompare(String(a.savedAt||'')))}
async function reminders(){return (await dbAll('reminders')).sort((a,b)=>String(a.date||'').localeCompare(String(b.date||'')))}
function money(n){return '₹'+Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}) }
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function today(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function dateDisplay(v){if(!v)return '';const [y,m,d]=v.split('-');return `${d}/${m}/${y}`}
function status(msg){const s=document.getElementById('status');if(s){s.textContent=msg;s.style.display='block';clearTimeout(window._st);window._st=setTimeout(()=>s.style.display='none',4500)}}
function openWA(phone,msg){if(!/^\d{10}$/.test(phone)){status('Invalid 10-digit customer number.');return false}window.open('https://wa.me/91'+phone+'?text='+encodeURIComponent(msg),'_blank','noopener');return true}
async function exportData(){const data={version:1,exportedAt:new Date().toISOString(),customers:await customers(),bills:await bills(),reminders:await reminders(),invoiceCounter:await getMeta('invoiceCounter',1000)};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='ESSENSUALS-Backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

const SERVICE_LIST=['Haircut', 'Hair Wash', 'Blow Dry', 'Hair Colour', 'Highlights', 'Global Colour', 'Balayage', 'Hair Spa', 'Keratin', 'Smoothening', 'Manicure', 'Pedicure', 'Facial', 'Beard Trim', 'Makeup']; let rows=[{name:'',price:''}];
function data(){const phone=document.getElementById('phone').value.replace(/\D/g,'');const used=rows.filter(r=>r.name&&Number(r.price)>0).map(r=>({name:r.name,price:Number(r.price)}));const sub=used.reduce((a,r)=>a+r.price,0);const pct=Math.max(0,Math.min(100,Number(document.getElementById('discount').value)||0));return {invoice:document.getElementById('invoice').value.trim(),date:document.getElementById('date').value,name:document.getElementById('name').value.trim(),phone,staff:document.getElementById('staff').value.trim(),discountPct:pct,discount:sub*pct/100,total:sub*(1-pct/100),subtotal:sub,services:used}}
function valid(d){if(!d.name)return status('Enter customer name.');if(!/^\d{10}$/.test(d.phone))return status('Enter a valid 10-digit phone number.');if(!d.services.length)return status('Add at least one service with a price.');return true}
function renderServices(){const box=document.getElementById('services');box.innerHTML=rows.map((r,i)=>`<div class="row"><select class="svc" data-i="${i}"><option value="">Select service</option>${SERVICE_LIST.map(s=>`<option ${s===r.name?'selected':''}>${esc(s)}</option>`).join('')}</select><input class="price" data-i="${i}" type="number" min="0" step="0.01" value="${esc(r.price)}" placeholder="Price"><button class="btn danger rem" data-i="${i}">×</button></div>`).join('');box.querySelectorAll('.svc').forEach(e=>e.onchange=()=>{rows[e.dataset.i].name=e.value;update()});box.querySelectorAll('.price').forEach(e=>e.oninput=()=>{rows[e.dataset.i].price=e.value;update()});box.querySelectorAll('.rem').forEach(e=>e.onclick=()=>{rows.splice(+e.dataset.i,1);if(!rows.length)rows=[{name:'',price:''}];renderServices();update()});}
function preview(d){document.getElementById('preview').innerHTML=`<div class="invoice-head"><div class="big">TONI&GUY</div><div class="small">ESSENSUALS</div><div class="addr">1st Floor, 1st A Cross Rd, Basaveshwara Layout, Ramakrishnappa Layout,<br>Nagashetty Halli, R.M.V. 2nd Stage, Bengaluru, Karnataka 560094<br>Ph: 9606033535</div></div><div class="invoice-title">TAX INVOICE</div><div class="meta"><div><b>Customer:</b> ${esc(d.name)}<br><b>Phone:</b> +91 ${esc(d.phone)}</div><div><b>Invoice:</b> ${esc(d.invoice)}<br><b>Date:</b> ${dateDisplay(d.date)}<br><b>Staff:</b> ${esc(d.staff||'—')}</div></div><table><thead><tr><th>No.</th><th>Service</th><th>Amount</th></tr></thead><tbody>${d.services.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.name)}</td><td>${money(r.price)}</td></tr>`).join('')}</tbody></table><div class="totals"><div><span>Subtotal</span><b>${money(d.subtotal)}</b></div><div><span>Discount (${d.discountPct}%)</span><b>− ${money(d.discount)}</b></div><div class="final"><span>Total</span><b>${money(d.total)}</b></div></div><div class="thanks">Thank you for visiting<br><b>TONI&GUY ESSENSUALS</b><br>We look forward to seeing you again!</div>`}
function update(){const d=data();preview(d)}
async function newBill(){if(!confirm('Start a new bill?'))return;document.getElementById('invoice').value=await nextInvoice();document.getElementById('date').value=today();['name','phone','staff'].forEach(id=>document.getElementById(id).value='');document.getElementById('discount').value=30;rows=[{name:'',price:''}];renderServices();update()}
async function save(){const d=data();if(!valid(d))return;if(!d.invoice)d.invoice=await nextInvoice();document.getElementById('invoice').value=d.invoice;await saveBill(d);await renderBills();await renderCustomers();status('Bill saved and customer data updated.')}
async function renderBills(){const q=document.getElementById('billSearch').value.toLowerCase();const a=(await bills()).filter(b=>!q||b.invoice.toLowerCase().includes(q)||b.name.toLowerCase().includes(q));document.getElementById('billList').innerHTML=a.slice(0,30).map(b=>`<div class="item"><b>${esc(b.invoice)}</b> · ${esc(b.name)} · ${money(b.total)}<div class="muted">${dateDisplay(b.date)} · +91 ${esc(b.phone)}</div><div class="actions"><button class="btn secondary load" data-id="${b.id}">Load</button><button class="btn danger del" data-id="${b.id}">Delete</button></div></div>`).join('')||'<div class="item">No saved bills.</div>';document.querySelectorAll('.load').forEach(x=>x.onclick=async()=>{const b=(await bills()).find(v=>v.id==x.dataset.id);if(!b)return;document.getElementById('invoice').value=b.invoice;document.getElementById('date').value=b.date;document.getElementById('name').value=b.name;document.getElementById('phone').value=b.phone;document.getElementById('staff').value=b.staff||'';document.getElementById('discount').value=b.discountPct;rows=b.services.map(v=>({...v}));renderServices();update();status('Loaded '+b.invoice)});document.querySelectorAll('.del').forEach(x=>x.onclick=async()=>{if(confirm('Delete this saved bill?')){await dbDel('bills',Number(x.dataset.id));renderBills()}})}
async function renderCustomers(){const a=await customers();document.getElementById('customers').innerHTML=a.slice(0,25).map(c=>`<div class="item"><b>${esc(c.name)}</b><div class="muted">+91 ${esc(c.phone)} · ${c.visits||0} visits · Last: ${dateDisplay(c.lastVisit)||'—'} · Spend: ${money(c.totalSpend||0)}</div></div>`).join('')||'<div class="item">No customers yet.</div>'}
function svg(d){let y=420;const lines=d.services.map((r,i)=>{const s=`<text x="80" y="${y}" font-family="Arial" font-size="20">${i+1}</text><text x="170" y="${y}" font-family="Arial" font-size="20">${esc(r.name)}</text><text x="1110" y="${y}" text-anchor="end" font-family="Arial" font-size="20">${money(r.price)}</text>`;y+=45;return s}).join('');return `<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500"><rect width="1200" height="1500" fill="white"/><text x="600" y="75" text-anchor="middle" font-family="Arial" font-size="55" font-weight="900">TONI&amp;GUY</text><text x="600" y="115" text-anchor="middle" font-family="Arial" font-size="25" letter-spacing="7">ESSENSUALS</text><text x="600" y="155" text-anchor="middle" font-family="Arial" font-size="15">RMV 2nd Stage • Bengaluru • 9606033535</text><line x1="60" y1="190" x2="1140" y2="190" stroke="black" stroke-width="3"/><text x="600" y="235" text-anchor="middle" font-family="Arial" font-size="28" font-weight="900">TAX INVOICE</text><text x="70" y="285" font-family="Arial" font-size="20">Customer: ${esc(d.name)}</text><text x="70" y="320" font-family="Arial" font-size="20">Phone: +91 ${esc(d.phone)}</text><text x="760" y="285" font-family="Arial" font-size="20">Invoice: ${esc(d.invoice)}</text><text x="760" y="320" font-family="Arial" font-size="20">Date: ${dateDisplay(d.date)}</text><line x1="60" y1="355" x2="1140" y2="355" stroke="black"/>${lines}<line x1="700" y1="${y}" x2="1140" y2="${y}" stroke="black"/><text x="760" y="${y+45}" font-family="Arial" font-size="20">Subtotal</text><text x="1110" y="${y+45}" text-anchor="end" font-family="Arial" font-size="20">${money(d.subtotal)}</text><text x="760" y="${y+82}" font-family="Arial" font-size="20">Discount (${d.discountPct}%)</text><text x="1110" y="${y+82}" text-anchor="end" font-family="Arial" font-size="20">− ${money(d.discount)}</text><text x="760" y="${y+130}" font-family="Arial" font-size="28" font-weight="900">TOTAL</text><text x="1110" y="${y+130}" text-anchor="end" font-family="Arial" font-size="28" font-weight="900">${money(d.total)}</text><text x="600" y="${y+230}" text-anchor="middle" font-family="Arial" font-size="22">Thank you for visiting TONI&amp;GUY ESSENSUALS</text></svg>`}
async function wa(){
 const d=data();
 if(!valid(d))return;
 if(!d.invoice){d.invoice=await nextInvoice();document.getElementById('invoice').value=d.invoice}
 let popup=null;
 // Open a blank tab immediately so browser popup blockers don't block the later WhatsApp navigation.
 try{popup=window.open('about:blank','_blank')}catch(e){}
 try{
   await saveBill(d); await renderBills(); await renderCustomers();
   const blob=await new Promise((res,rej)=>{
     const im=new Image();
     im.onload=()=>{const c=document.createElement('canvas');c.width=1200;c.height=1500;const ctx=c.getContext('2d');ctx.drawImage(im,0,0);c.toBlob(b=>b?res(b):rej(new Error('image failed')),'image/png')};
     im.onerror=()=>rej(new Error('image failed'));
     im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg(d));
   });
   const file=new File([blob],`ESSENSUALS-${d.invoice}.png`,{type:'image/png'});
   const msg=`Hi ${d.name}, thank you for visiting TONI&GUY ESSENSUALS. Invoice ${d.invoice} total ${money(d.total)}.`;

   // iPhone/iPad and supported mobile browsers: use the native share sheet so WhatsApp can receive the bill image.
   if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
     if(popup)popup.close();
     await navigator.share({files:[file],text:msg});
     status('Bill image shared. Select WhatsApp and the customer chat, then Send.');
     return;
   }

   // Desktop Chrome/Edge: copy the actual PNG to the clipboard, then open the customer's WhatsApp chat.
   let copied=false;
   try{if(navigator.clipboard&&window.ClipboardItem){await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);copied=true}}catch(e){}
   const url='https://wa.me/91'+d.phone+'?text='+encodeURIComponent(msg+(copied?'\n\nBill image is copied. Paste it with Ctrl+V, then Send.':''));
   if(popup)popup.location.href=url; else window.open(url,'_blank','noopener');
   status(copied?'Bill copied. WhatsApp opened — press Ctrl+V, then Send.':'WhatsApp opened, but this browser did not allow image copying.');
 }catch(e){if(popup)popup.close();status(e?.name==='AbortError'?'Share cancelled.':'WhatsApp sharing failed. Please try again.');console.error(e)}
}
document.getElementById('add').onclick=()=>{rows.push({name:'',price:''});renderServices()};document.getElementById('save').onclick=save;document.getElementById('new').onclick=newBill;document.getElementById('wa').onclick=wa;document.getElementById('print').onclick=()=>{const d=data();if(valid(d))window.print()};document.getElementById('discount').oninput=update;['name','phone','staff'].forEach(id=>document.getElementById(id).oninput=update);document.getElementById('phone').oninput=async()=>{const e=document.getElementById('phone');e.value=e.value.replace(/\D/g,'').slice(0,10);const c=(await customers()).find(x=>x.phone===e.value);if(c&&!document.getElementById('name').value)document.getElementById('name').value=c.name;update()};document.getElementById('billSearch').oninput=renderBills;document.getElementById('refresh').onclick=renderCustomers;document.getElementById('backup').onclick=exportData;(async()=>{document.getElementById('invoice').value=await nextInvoice();document.getElementById('date').value=today();renderServices();update();await renderBills();await renderCustomers()})();
</script></body></html>
