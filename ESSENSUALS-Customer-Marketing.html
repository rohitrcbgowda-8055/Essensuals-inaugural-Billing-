<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ESSENSUALS Customer & Marketing</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f4f4;color:#111}.top{background:#111;color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:25px;font-weight:900;letter-spacing:1px}.brand small{display:block;font-size:11px;letter-spacing:5px;margin-top:3px}.top a{color:#fff;text-decoration:none;border:1px solid #555;padding:9px 13px;border-radius:8px;font-size:12px}.wrap{max-width:1400px;margin:20px auto;padding:0 18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:18px;box-shadow:0 4px 18px #0000000a}.card h2{margin:0 0 14px;font-size:18px}.row{display:grid;grid-template-columns:1fr 160px 42px;gap:8px;margin:8px 0}input,select,textarea{width:100%;padding:11px;border:1px solid #ccc;border-radius:8px;background:#fff;font:inherit}textarea{min-height:90px;resize:vertical}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:8px;padding:11px 14px;font-weight:700;cursor:pointer}.primary{background:#111;color:#fff}.secondary{background:#eee;color:#111}.danger{background:#f1d9d9}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.status{position:fixed;right:20px;bottom:20px;background:#111;color:#fff;padding:13px 16px;border-radius:9px;display:none;z-index:20}.list{max-height:470px;overflow:auto}.item{border:1px solid #ddd;border-radius:10px;padding:12px;margin:8px 0}.item .muted{font-size:12px;color:#666;margin-top:4px}.pill{display:inline-block;padding:4px 7px;border-radius:20px;background:#eee;font-size:11px;font-weight:700}.preview{background:#fff;border:1px solid #ccc;min-height:500px;padding:24px;max-width:650px;margin:auto}.invoice-head{text-align:center;border-bottom:2px solid #111;padding-bottom:14px}.invoice-head .big{font-size:34px;font-weight:900}.invoice-head .small{font-size:13px;letter-spacing:6px}.addr{font-size:10px;line-height:1.5;margin-top:8px}.invoice-title{text-align:center;font-weight:900;margin:16px 0}.meta{display:grid;grid-template-columns:1fr 1fr;font-size:12px;line-height:1.7}.preview table{width:100%;border-collapse:collapse;font-size:12px}.preview th,.preview td{padding:8px;border-bottom:1px solid #ddd;text-align:left}.preview th:last-child,.preview td:last-child{text-align:right}.totals{margin-left:auto;max-width:270px;margin-top:12px;font-size:12px}.totals div{display:flex;justify-content:space-between;padding:5px}.totals .final{font-size:17px;font-weight:900;border-top:2px solid #111;margin-top:5px;padding-top:9px}.thanks{text-align:center;margin-top:30px;font-size:11px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}.stat{background:#fff;border:1px solid #ddd;border-radius:12px;padding:14px}.stat b{font-size:22px;display:block}.stat span{font-size:11px;color:#666}.wide{grid-column:1/-1}@media(max-width:900px){.grid{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.preview{max-width:none}.row{grid-template-columns:1fr 120px 42px}}
@media print{body{background:#fff}.top,.no-print,.card:not(.print-card),.status{display:none!important}.wrap{margin:0;padding:0}.grid{display:block}.print-card{display:block;border:0;box-shadow:none;padding:0}.preview{border:0;max-width:none}}
</style></head><body><div class="top"><div class="brand">TONI&GUY <small>ESSENSUALS</small></div><a id="billingLink" href="./index.html" target="_self" rel="noopener">Billing App</a></div><div class="wrap"><div id="status" class="status"></div><div class="stats"><div class="stat"><b id="sCustomers">0</b><span>Customers</span></div><div class="stat"><b id="sVisits">0</b><span>Total visits</span></div><div class="stat"><b id="sDue">0</b><span>Due reminders</span></div><div class="stat"><b id="sSpend">₹0</b><span>Total recorded sales</span></div></div><div class="grid"><div class="card"><h2>Customers</h2><input id="search" placeholder="Search name or phone"><div class="actions"><button class="btn secondary" id="refresh">Refresh</button><button class="btn secondary" id="backup">Export Backup</button></div><div class="list" id="customerList"></div></div><div class="card"><h2>Create Offer / Reminder</h2><label>Customer</label><select id="customer"><option value="">Select customer</option></select><div class="fields"><div><label>Type</label><select id="type"><option value="offer">Special Offer</option><option value="birthday">Birthday Offer</option><option value="festival">Festival Offer</option><option value="followup">Visit Follow-up</option></select></div><div><label>Reminder Date</label><input id="rdate" type="date"></div></div><label>Title</label><input id="title" placeholder="Flat 30% Off / Birthday Offer"><label>WhatsApp Message</label><textarea id="message" placeholder="Message to customer"></textarea><div class="actions"><button class="btn primary" id="send">Open WhatsApp</button><button class="btn secondary" id="save">Save Reminder</button><button class="btn secondary" id="cancelEdit" style="display:none">Cancel Edit</button><button class="btn secondary" id="useBill">Use customer from billing app</button></div></div><div class="card wide"><h2>Upcoming & Due Reminders</h2><div class="list" id="reminders"></div></div><div class="card wide"><h2>Customer Profile</h2><div id="profile">Select a customer to see details.</div></div></div></div><script>
let editingReminderId=null;
const DB_NAME='ESSENSUALS_SHARED_DB_V1'; const DB_VER=1;
function makeFallbackDB(){
 const prefix='ESSENSUALS_FALLBACK_'+DB_NAME+'_';
 const mem={customers:[],bills:[],reminders:[],meta:[]};
 const canLS=()=>{try{const k='__ess_test__';localStorage.setItem(k,'1');localStorage.removeItem(k);return true}catch(e){return false}};
 const useLS=canLS();
 const load=k=>{if(!useLS)return mem[k].slice();try{return JSON.parse(localStorage.getItem(prefix+k)||'[]')}catch(e){return mem[k].slice()}};
 const save=(k,v)=>{if(!useLS){mem[k]=v.slice();return}try{localStorage.setItem(prefix+k,JSON.stringify(v))}catch(e){mem[k]=v.slice()}};
 ['customers','bills','reminders','meta'].forEach(k=>{if(useLS){try{if(localStorage.getItem(prefix+k)===null)save(k,[])}catch(e){}}});
 return {transaction:(name)=>({objectStore:()=>({
   getAll:()=>{const q={result:load(name)};setTimeout(()=>q.onsuccess&&q.onsuccess({target:q}),0);return q},
   get:(key)=>{const arr=load(name), keyName=name==='meta'?'key':'id';const q={result:arr.find(x=>x[keyName]===key)};setTimeout(()=>q.onsuccess&&q.onsuccess({target:q}),0);return q},
   put:(value)=>{const arr=load(name), keyName=name==='meta'?'key':'id';let v={...value};if(keyName==='id'&&(v.id===undefined||v.id===null)){const ids=arr.map(x=>Number(x.id)||0);v.id=(ids.length?Math.max(...ids):0)+1}const i=arr.findIndex(x=>x[keyName]===v[keyName]);if(i>=0)arr[i]=v;else arr.push(v);save(name,arr);return {result:v}},
   delete:(key)=>{const arr=load(name),keyName=name==='meta'?'key':'id';save(name,arr.filter(x=>x[keyName]!==key));return {result:undefined}}
 })})};
}
let fallbackDB=null;
function dbOpen(){return new Promise((res,rej)=>{try{if(!window.indexedDB)throw new Error('IndexedDB unavailable');const r=indexedDB.open(DB_NAME,DB_VER);r.onupgradeneeded=()=>{const d=r.result;['customers','bills','reminders','meta'].forEach(s=>{if(!d.objectStoreNames.contains(s)){const key=s==='meta'?'key':'id';d.createObjectStore(s,{keyPath:key,autoIncrement:key==='id'});}})};r.onsuccess=()=>res(r.result);r.onerror=()=>{fallbackDB=fallbackDB||makeFallbackDB();res(fallbackDB)}}catch(e){fallbackDB=fallbackDB||makeFallbackDB();res(fallbackDB)}})}
async function tx(store,mode,fn){const d=await dbOpen();if(d===fallbackDB){try{return await fn(d.transaction(store,mode).objectStore(store))}catch(e){throw e}}return new Promise((res,rej)=>{const t=d.transaction(store,mode);const s=t.objectStore(store);let out;try{out=fn(s)}catch(e){rej(e);return}t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error)})}
const dbAll=s=>tx(s,'readonly',st=>new Promise((res,rej)=>{const r=st.getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
const dbPut=(s,v)=>tx(s,'readwrite',st=>st.put(v)); const dbDel=(s,k)=>tx(s,'readwrite',st=>st.delete(k));
async function getMeta(key,def){const v=await tx('meta','readonly',s=>new Promise(r=>{const q=s.get(key);q.onsuccess=()=>r(q.result?.value??def)}));return v}
async function setMeta(key,value){return dbPut('meta',{key,value})}
async function nextInvoice(){let n=Number(await getMeta('invoiceCounter',1000))+1;await setMeta('invoiceCounter',n);return 'INV-'+n}
async function customers(){return (await dbAll('customers')).sort((a,b)=>String(b.updatedAt||'').localeCompare(String(a.updatedAt||'')))}
async function saveCustomer(c){const all=await customers();const old=all.find(x=>x.phone===c.phone);const rec={...(old||{}),...c,id:old?.id,updatedAt:new Date().toISOString()};if(old) rec.id=old.id; else rec.visits=rec.visits||0;await dbPut('customers',rec);return rec}
async function saveBill(b){await dbPut('bills',{...b,savedAt:new Date().toISOString()});const old=(await customers()).find(c=>c.phone===b.phone);await saveCustomer({name:b.name,phone:b.phone,visits:(old?.visits||0)+1,lastVisit:b.date,lastInvoice:b.invoice,totalSpend:(old?.totalSpend||0)+b.total});return true}
async function bills(){return (await dbAll('bills')).sort((a,b)=>String(b.savedAt||'').localeCompare(String(a.savedAt||'')))}
async function reminders(){return (await dbAll('reminders')).sort((a,b)=>String(a.date||'').localeCompare(String(b.date||'')))}
function money(n){return '₹'+Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}) }
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function today(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function dateDisplay(v){if(!v)return '';const [y,m,d]=v.split('-');return `${d}/${m}/${y}`}
function status(msg){const s=document.getElementById('status');if(s){s.textContent=msg;s.style.display='block';clearTimeout(window._st);window._st=setTimeout(()=>s.style.display='none',4500)}}
function openWA(phone,msg){if(!/^\d{10}$/.test(phone)){status('Invalid 10-digit customer number.');return false}window.open('https://wa.me/91'+phone+'?text='+encodeURIComponent(msg),'_blank','noopener');return true}
async function exportData(){const data={version:1,exportedAt:new Date().toISOString(),customers:await customers(),bills:await bills(),reminders:await reminders(),invoiceCounter:await getMeta('invoiceCounter',1000)};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='ESSENSUALS-Backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

async function selected(){return (await customers()).find(c=>String(c.id)===document.getElementById('customer').value)}
function defaultMsg(type,name){const n=name||'there';if(type==='birthday')return `Hi ${n}! 🎂 Happy Birthday from TONI&GUY ESSENSUALS! Enjoy a special birthday offer on your next visit. Call 9606033535 to book.`;if(type==='festival')return `Hi ${n}! ✨ Festival wishes from TONI&GUY ESSENSUALS. Enjoy our special festival offer. Book your appointment today.`;if(type==='followup')return `Hi ${n}! We hope you loved your last visit to TONI&GUY ESSENSUALS. It’s time for your next salon appointment. Call 9606033535 to book.`;return `Hi ${n}! 🎁 A special offer from TONI&GUY ESSENSUALS — enjoy our latest salon offer. Book your appointment today on 9606033535.`}
async function refreshCustomers(){const a=await customers();const q=document.getElementById('search').value.toLowerCase();const f=a.filter(c=>!q||c.name.toLowerCase().includes(q)||c.phone.includes(q));document.getElementById('customer').innerHTML='<option value="">Select customer</option>'+a.map(c=>`<option value="${c.id}">${esc(c.name)} — +91 ${esc(c.phone)}</option>`).join('');document.getElementById('customerList').innerHTML=f.map(c=>`<div class="item"><b>${esc(c.name)}</b><div class="muted">+91 ${esc(c.phone)} · ${c.visits||0} visits · Last visit: ${dateDisplay(c.lastVisit)||'—'} · Spend: ${money(c.totalSpend||0)}</div><div class="actions"><button class="btn secondary choose" data-id="${c.id}">Select</button><button class="btn secondary chat" data-phone="${c.phone}" data-name="${esc(c.name)}">WhatsApp</button></div></div>`).join('')||'<div class="item">No customers found.</div>';document.querySelectorAll('.choose').forEach(b=>b.onclick=()=>{document.getElementById('customer').value=b.dataset.id;profile()});document.querySelectorAll('.chat').forEach(b=>b.onclick=()=>openWA(b.dataset.phone,defaultMsg('offer',b.dataset.name)));const totalVisits=a.reduce((s,c)=>s+(c.visits||0),0),spend=a.reduce((s,c)=>s+(c.totalSpend||0),0);document.getElementById('sCustomers').textContent=a.length;document.getElementById('sVisits').textContent=totalVisits;document.getElementById('sSpend').textContent=money(spend);}
async function profile(){const c=await selected();if(!c){document.getElementById('profile').textContent='Select a customer to see details.';return}const bs=(await bills()).filter(b=>b.phone===c.phone);document.getElementById('profile').innerHTML=`<h3 style="margin:0">${esc(c.name)}</h3><p style="font-size:13px">+91 ${esc(c.phone)} · ${c.visits||0} visits · Last visit ${dateDisplay(c.lastVisit)||'—'} · Total spend ${money(c.totalSpend||0)}</p><div class="list">${bs.slice(0,10).map(b=>`<div class="item">${esc(b.invoice)} · ${money(b.total)} · ${dateDisplay(b.date)}</div>`).join('')||'<div class="item">No bills found.</div>'}</div>`}
async function renderReminders(){const a=await reminders(),t=today();const due=a.filter(r=>!r.sent&&r.date<=t).length;document.getElementById('sDue').textContent=due;document.getElementById('reminders').innerHTML=a.map(r=>`<div class="item"><span class="pill">${esc(r.type)}</span> <b>${esc(r.title)}</b><div class="muted">${dateDisplay(r.date)} · ${esc(r.name)} · +91 ${esc(r.phone)} · ${r.sent?'Sent':'Pending'}</div><div class="actions">${r.sent?'':'<button class="btn primary sendOne" data-id="'+r.id+'">WhatsApp</button>'}<button class="btn secondary editOne" data-id="${r.id}">Edit</button><button class="btn danger delOne" data-id="${r.id}">Delete</button></div></div>`).join('')||'<div class="item">No reminders.</div>';document.querySelectorAll('.sendOne').forEach(b=>b.onclick=async()=>{const x=(await reminders()).find(v=>v.id==b.dataset.id);if(x&&openWA(x.phone,x.message)){x.sent=true;x.sentAt=new Date().toISOString();await dbPut('reminders',x);renderReminders()}});document.querySelectorAll('.editOne').forEach(b=>b.onclick=async()=>{const x=(await reminders()).find(v=>v.id==b.dataset.id);if(!x)return;document.getElementById('customer').value=String((await customers()).find(c=>c.phone===x.phone)?.id||'');document.getElementById('type').value=x.type;document.getElementById('rdate').value=x.date;document.getElementById('title').value=x.title;document.getElementById('message').value=x.message;editingReminderId=x.id;document.getElementById('save').textContent='Update Reminder';document.getElementById('cancelEdit').style.display='inline-block';status('Reminder loaded. Make changes and click Update Reminder.')});document.querySelectorAll('.delOne').forEach(b=>b.onclick=async()=>{if(confirm('Delete reminder?')){await dbDel('reminders',Number(b.dataset.id));renderReminders()}})}
async function saveReminder(){const c=await selected(),type=document.getElementById('type').value,date=document.getElementById('rdate').value||today(),title=document.getElementById('title').value.trim(),message=document.getElementById('message').value.trim();if(!c)return status('Select a customer.');if(!message)return status('Enter a WhatsApp message.');const record={name:c.name,phone:c.phone,type,date,title:title||type,message,createdAt:new Date().toISOString()};if(editingReminderId!==null){const old=(await reminders()).find(r=>r.id==editingReminderId);if(old){record.id=old.id;record.sent=old.sent||false;record.sentAt=old.sentAt||null;record.createdAt=old.createdAt||record.createdAt;await dbPut('reminders',record);editingReminderId=null;document.getElementById('save').textContent='Save Reminder';document.getElementById('cancelEdit').style.display='none';renderReminders();status('Reminder updated.');return}}record.sent=false;await dbPut('reminders',record);renderReminders();status('Reminder saved.')}
document.getElementById('billingLink').onclick=(e)=>{e.preventDefault();const base=window.location.href.split('#')[0].replace(/[^/]*$/,'');window.location.assign(base+'index.html')};document.getElementById('customer').onchange=async()=>{const c=await selected();if(c){document.getElementById('message').value=defaultMsg(document.getElementById('type').value,c.name);document.getElementById('title').value=document.getElementById('type').value==='followup'?'Visit Follow-up':document.getElementById('type').value==='birthday'?'Birthday Offer':document.getElementById('type').value==='festival'?'Festival Offer':'Special Offer';profile()}};document.getElementById('type').onchange=async()=>{const type=document.getElementById('type').value,c=await selected();document.getElementById('message').value=defaultMsg(type,c?.name);document.getElementById('title').value=type==='followup'?'Visit Follow-up':type==='birthday'?'Birthday Offer':type==='festival'?'Festival Offer':'Special Offer';};document.getElementById('send').onclick=async()=>{const c=await selected(),m=document.getElementById('message').value.trim();if(c&&m)openWA(c.phone,m);else status('Select customer and enter message.')};document.getElementById('save').onclick=saveReminder;document.getElementById('cancelEdit').onclick=()=>{editingReminderId=null;document.getElementById('save').textContent='Save Reminder';document.getElementById('cancelEdit').style.display='none';status('Edit cancelled.');};document.getElementById('refresh').onclick=async()=>{await refreshCustomers();await renderReminders()};document.getElementById('search').oninput=refreshCustomers;document.getElementById('backup').onclick=exportData;document.getElementById('useBill').onclick=async()=>{const bs=await bills();const b=bs[0];if(!b)return status('No saved bill found. Save a bill first.');const c=(await customers()).find(x=>x.phone===b.phone);if(c){document.getElementById('customer').value=c.id;document.getElementById('message').value=defaultMsg('followup',c.name);profile();status('Latest billing customer selected.')}};(async()=>{document.getElementById('rdate').value=today();await refreshCustomers();await renderReminders()})();
</script></body></html>
